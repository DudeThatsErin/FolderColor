name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Attest main.js
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: main.js

      - name: Attest styles.css
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: styles.css

      - name: Prepare release description
        run: |
          if [ -f CHANGELOG.md ]; then
            awk -v version="$GITHUB_REF_NAME" '
              $0 ~ "^##[[:space:]]+" version "([[:space:]]|$)" { found=1; next }
              found && /^##[[:space:]]/ { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            {
              echo "## Changes in $GITHUB_REF_NAME"
              previous_tag=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
              if [ -n "$previous_tag" ]; then
                git log --format='- %s' "$previous_tag..$GITHUB_SHA"
              else
                git log --format='- %s' "$GITHUB_SHA"
              fi
            } > release-notes.md
          fi
          test -s release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            main.js
            styles.css
            manifest.json
            versions.json
